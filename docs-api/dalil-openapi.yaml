  /rest/v1/featured:
    get:
      tags:
      - Owner and staff (tables)
      operationId: list_featured
      summary: Read featured placements
      description: 'Staff (sales/admin). Anonymous callers get 401. The public directory reads featured_now instead.
        A row is active when starts_at <= now < ends_at. The admin UI warns when more than 3 places of the same
        category (restaurant/cafe/hotel) are active at once (they rotate). Default new slot: today to today+29 days.'
      security: *id003
      parameters:
      - *id005
      - *id006
      - *id007
      - *id008
      - *id009
      - *id001
