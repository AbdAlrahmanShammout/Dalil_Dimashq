        application/json:
          schema:
            $ref: '#/components/schemas/PostgrestError'
    '409':
      description: Duplicate (23505) or wrong state (55000). PostgREST maps these codes to 409 or 400 depending
        on version; check code, not status.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PostgrestError'
    '422':
      description: Business rule refused (P0001 or 55000 with a message). Exact HTTP status depends on PostgREST's
        SQLSTATE mapping; rely on code and message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PostgrestError'
