        '400':
          $ref: '#/components/responses/400'
      x-callers: &id002
      - website
      - netlify-functions
      - app
      - admin
      - owner
      x-source: supabase/migrations/20260926090000_core_schema.sql l.42, l.607-614
    patch:
      tags:
      - Directory (tables)
      operationId: patch_places
      summary: PATCH places
      description: 'Editors: any column. Premium owners, as the owner page implements it: PATCH only phones,
        website, email, facebook, instagram, description_ar, description_en, osm_hours (array DIRECT in
        public/owner/index.html). Name, type and address go through change_requests kind=edit. tourism_class also
        goes through change_requests. Identity, type, location, status and class changes on PATCH are refused by
        trigger places_guard with 42501. The owner page writes osm_hours text; it does not write place_hours.
        Structured place_hours rows are saved from the admin page only (delete-all then insert).'
      security: &id003
      - apikey: []
        bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Prefer'
      - *id001
      responses:
        '204':
          description: 'Done. With Prefer: return=representation the rows are returned.'
        '400':
          $ref: '#/components/responses/400'
        '401':
