components:
  securitySchemes:
    apikey:
      type: apiKey
      in: header
      name: apikey
      description: The publishable (anon) key of the project. Public by design; safe inside the app. Never a service-role key.
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from /auth/v1. Without it the caller is a visitor (anon).
    legacyAdminPassword:
      type: http
      scheme: bearer
      description: 'Legacy: the ADMIN_PASSWORD Netlify environment variable. Deprecated with /api/edits. Kept from the 16 Oct reconstruction. Not used by the app.'
  parameters:
    select:
      name: select
      in: query
      schema:
        type: string
      description: Columns, e.g. id,name_ar,area:areas(name_ar)
    order:
      name: order
      in: query
      schema:
        type: string
      description: e.g. created_at.desc
    limit:
      name: limit
      in: query
      schema:
        type: integer
    offset:
      name: offset
      in: query
      schema:
        type: integer
    filter:
      name: filters
      in: query
      style: form
      explode: true
      schema:
        type: object
        additionalProperties:
          type: string
      description: Any column as a PostgREST filter, e.g. place_id=eq.abc123, status=in.(active,temporarily_closed)
    prefer:
      name: Prefer
      in: header
      schema:
        type: string
      description: e.g. return=representation, count=exact
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          description: SQLSTATE, e.g. 42501, 22023, 23505, P0001
        message:
          type: string
          description: Stable code (new functions) or English sentence (older functions)
        details:
          type: string
          nullable: true
        hint:
          type: string
          nullable: true
    booking_status:
      type: string
      enum:
      - waiting
      - pending
      - confirmed
      - rejected
      - expired
      - cancelled_by_customer
      - cancelled_by_owner
      - attended
      - no_show
    fake_report_status:
      type: string
      enum:
      - open
      - confirmed
      - rejected
    payment_method:
      type: string
      enum:
      - cash
      - syriatel_cash
      - mtn_cash
      - bank_transfer
      - other
    place_status:
      type: string
      enum:
      - active
      - temporarily_closed
      - permanently_closed
      - hidden
    place_type:
      type: string
      enum:
      - restaurant
      - fast_food
      - cafe
      - hotel
      - guest_house
      - hostel
      - motel
    rating_status:
      type: string
