    en: Booking is not available on this account.
  - message_starts_with: Owners cannot book at their own place
    code: own_place_booking
    ar: لا يمكنك الحجز في منشأتك.
    en: You cannot book at your own place.
  - message_starts_with: This place is not taking bookings
    code: booking_off
    ar: لا تستقبل هذه المنشأة الحجوزات حالياً.
    en: This place is not taking bookings right now.
  - message_starts_with: Book within
    code: booking_horizon
    ar: يمكن الحجز خلال الأيام السبعة القادمة فقط.
    en: You can book within the next 7 days only.
  - message_starts_with: This place needs at least
