        application/json:
          schema:
            $ref: '#/components/schemas/Error'
x-dalil-error-codes:
  how_to_read: 'Look up `message` in `stable` first; if not found, match the start of `message` against `older`. Anything else: general message
    «حدث خطأ، يرجى المحاولة مرة أخرى.» / "Something went wrong, please try again." A row-level-security refusal (42501 without our code) shows
    not_allowed.'
  stable:
  - code: not_signed_in
    sqlstate: '42501'
    ar: يرجى تسجيل الدخول أولاً.
    en: Please sign in first.
  - code: email_not_confirmed
    sqlstate: '42501'
    ar: يرجى تأكيد بريدك الإلكتروني أولاً.
    en: Please confirm your email first.
  - code: profile_incomplete
    sqlstate: '42501'
    ar: يرجى إكمال ملفك الشخصي أولاً.
    en: Please complete your profile first.
  - code: profile_already_complete
    sqlstate: P0001
    ar: ملفك الشخصي مكتمل. لتعديل الاسم أو سنة الميلاد أرسل طلب تعديل.
    en: Your profile is complete. To change your name or birth year, send a change request.
  - code: name_invalid
    sqlstate: '22023'
    ar: يجب أن يتكوّن كلٌّ من الاسم والكنية من حرفين إلى أربعين حرفاً دون أرقام.
    en: First and last name must each be 2 to 40 letters, without digits.
  - code: phone_invalid
    sqlstate: '22023'
    ar: يرجى إدخال رقم جوال سوري صحيح، مثل 09xx xxx xxx.
    en: Please enter a valid Syrian mobile number, like 09xx xxx xxx.
  - code: phone_taken
    sqlstate: '23505'
    ar: هذا الرقم مستخدم في حساب آخر.
    en: This number is already used by another account.
  - code: birth_year_invalid
    sqlstate: '22023'
    ar: يرجى إدخال سنة ميلاد صحيحة.
    en: Please enter a valid birth year.
  - code: too_young
    sqlstate: '22023'
    ar: يجب أن يكون عمرك ١٦ سنة أو أكثر.
    en: You must be 16 or older.
  - code: language_invalid
    sqlstate: '22023'
    ar: اللغة غير مدعومة.
    en: This language is not supported.
  - code: nothing_to_change
    sqlstate: '22023'
    ar: لا يتضمّن الطلب أي تغيير.
    en: The request changes nothing.
  - code: request_pending
    sqlstate: P0001
    ar: لديك طلب قيد المراجعة بالفعل.
    en: You already have a request under review.
  - code: request_not_pending
    sqlstate: P0001
    ar: هذا الطلب لم يعد قيد المراجعة.
    en: This request is no longer under review.
  - code: not_allowed
    sqlstate: '42501'
    ar: لا تملك صلاحية تنفيذ هذا الإجراء.
    en: You are not allowed to do this.
  - code: not_linked
    sqlstate: '42501'
    ar: هذه المنشأة غير مرتبطة بحسابك.
    en: This place is not linked to your account.
  - code: place_not_found
    sqlstate: '22023'
    ar: المنشأة غير موجودة.
    en: Place not found.
  - code: place_owner_limit
    sqlstate: '23514'
    ar: بلغت هذه المنشأة الحد الأقصى لعدد المالكين (ثلاثة).
    en: This place already has the maximum of 3 owners.
  - code: hours_invalid
    sqlstate: '22023'
    ar: 'جدول الدوام غير صحيح: تحقّق من الأوقات وألّا تتداخل الفترات، وبحدّ أقصى ثلاث فترات في اليوم.'
    en: 'The opening hours are not valid: check the times, that periods do not overlap, and at most 3 periods a day.'
  - code: legal_not_found
    sqlstate: '22023'
    ar: تعذّر العثور على هذه النسخة.
    en: This version was not found.
  - code: legal_kind_invalid
    sqlstate: '22023'
    ar: نوع المستند غير صحيح.
    en: Unknown document type.
  - code: legal_text_missing
    sqlstate: '22023'
    ar: يجب إدخال النص العربي والإنكليزي معاً.
    en: Both the Arabic and the English text are required.
  - code: legal_document_locked
    sqlstate: '42501'
    ar: لا يمكن تعديل نسخة منشورة أو حذفها؛ انشر نسخة جديدة.
    en: A published version cannot be changed or deleted; publish a new one.
  - code: payment_not_found
    sqlstate: '22023'
    ar: الدفعة غير موجودة أو ملغاة مسبقاً.
    en: Payment not found, or already voided.
  - code: payment_locked
    sqlstate: '42501'
    ar: لا يمكن تعديل دفعة محفوظة أو حذفها؛ يمكن إلغاؤها مع ذكر السبب.
    en: A saved payment cannot be changed or deleted; it can be voided with a reason.
  - code: void_reason_missing
    sqlstate: '22023'
    ar: يرجى كتابة سبب الإلغاء.
    en: Please give the reason for voiding.
  - code: receipt_counter_full
    sqlstate: '54000'
    ar: تجاوز عدد الإيصالات الحدّ الشهري.
    en: Too many receipts this month.
  older:
  - message_starts_with: Confirm your email first
    code: email_not_confirmed
    ar: يرجى تأكيد بريدك الإلكتروني أولاً.
    en: Please confirm your email first.
  - message_starts_with: Sign in first
    code: not_signed_in
    ar: يرجى تسجيل الدخول أولاً.
    en: Please sign in first.
  - message_starts_with: Too many wrong codes today
    code: code_attempts
    ar: تجاوزت عدد المحاولات المسموح اليوم. حاول مجدداً غداً.
    en: Too many wrong codes today. Try again tomorrow.
  - message_starts_with: Sign in with a confirmed account to book
    code: booking_needs_account
    ar: يرجى تسجيل الدخول بحساب مؤكَّد لإجراء الحجز.
    en: Please sign in with a confirmed account to book.
  - message_starts_with: Booking is blocked on this account
    code: booking_blocked
