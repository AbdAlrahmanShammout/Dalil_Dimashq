    en: This place needs more notice before the booking time.
  - message_starts_with: The place is closed at that time
    code: booking_closed_time
    ar: المنشأة مغلقة في هذا الوقت.
    en: The place is closed at that time.
  - message_starts_with: Pick a time on the quarter hour
    code: booking_quarter
    ar: يرجى اختيار وقت على رأس الربع ساعة.
    en: Please pick a time on the quarter hour.
  - message_starts_with: Party size must be between
    code: booking_party_size
    ar: عدد الأشخاص خارج الحدود المسموحة.
    en: The party size is outside the allowed range.
  - message_starts_with: That offer does not cover this time
    code: booking_offer_time
    ar: العرض لا يشمل هذا الوقت.
    en: The offer does not cover this time.
  - message_starts_with: You already asked for this time
    code: booking_duplicate
    ar: لديك طلب حجز في هذا الوقت بالفعل.
    en: You already asked for this time.
  - message_starts_with: You already have 3 open bookings
    code: booking_open_limit
    ar: لديك ثلاثة حجوزات مفتوحة؛ هذا هو الحد الأقصى.
    en: You already have 3 open bookings, the maximum.
  - message_starts_with: Too many booking requests
    code: booking_rate
    ar: عدد كبير من طلبات الحجز؛ حاول لاحقاً.
    en: Too many booking requests; try again later.
  - message_starts_with: Enter your name
    code: booking_name
    ar: يرجى إدخال الاسم.
    en: Please enter your name.
  - message_starts_with: Enter a valid phone number
    code: phone_invalid
    ar: يرجى إدخال رقم جوال سوري صحيح، مثل 09xx xxx xxx.
    en: Please enter a valid Syrian mobile number.
  - message_starts_with: Booking not found
    code: booking_not_found
    ar: الحجز غير موجود.
    en: Booking not found.
  - message_starts_with: This booking can no longer be cancelled
    code: booking_cancel_late
    ar: لم يعد بالإمكان إلغاء هذا الحجز.
    en: This booking can no longer be cancelled.
  - message_starts_with: This booking can no longer be confirmed
    code: booking_confirm_late
    ar: لم يعد بالإمكان تأكيد هذا الحجز.
    en: This booking can no longer be confirmed.
  - message_starts_with: This booking is no longer waiting for an answer
    code: booking_answered
