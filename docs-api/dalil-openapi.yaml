openapi: 3.0.3
info:
  title: Dalil Dimashq backend API
  version: '2026-10-21'
  description: 'CONFIDENTIAL. Shared with the app developer under the project agreement; do not publish or forward.


    The backend is Supabase: PostgREST (/rest/v1), Auth (/auth/v1) and Storage (/storage/v1). There is no custom server; every rule lives in the
    database (row-level security, triggers and SECURITY DEFINER functions), so the app may never decide a rule on its own.


    This file was generated from the database migrations on the main branch (21 Oct 2026). It holds no keys, no project address and no personal
    data. The project URL and the publishable (anon) key come from Rami for the staging project; service-role or secret keys are never used in
    the app.


    **Calling.** Every request sends `apikey: <publishable key>`. Signed-in requests also send `Authorization: Bearer <access token>` from Auth.
    Database functions are `POST /rest/v1/rpc/<name>` with a JSON object of named arguments (p_...). Tables are read and written with PostgREST
    query syntax (https://postgrest.org/en/stable/references/api/tables_views.html).


    **Errors.** PostgREST returns `{code, message, details, hint}`. New functions put a stable code in `message` (e.g. phone_taken); older ones
    put an English sentence. Both lists, with Arabic and English texts, are in `x-dalil-error-codes` at the end of this file. A row-level-security
    refusal is SQLSTATE 42501 or an empty result.


    **Availability.** Each operation says whether it exists on production yet (`x-dalil-availability`). Bookings, notifications and push devices
    are on staging only. Build against staging.


    **Roles.** Visitor (anon), signed-in user, owner (an account linked to a place; premium owner = the place has a running subscription), and
    staff: admin, editor, moderator, sales (the admin counts as every role).


    **Kept from the 16 Oct reconstruction.** The generated file does not describe the public website pages, the legacy edits store, or account
    deletion. Those paths are appended here (place page, category lists, sitemap, fallback snapshot, share image, deprecated /api/edits, and
    POST /functions/v1/delete-account) so this file stays the single spec for the app and the site. Notification `kind` values known from the
    booking migration are noted on the notifications schema; the generator left that column as a free string.'
servers:
- url: https://{project}.supabase.co
  description: Supabase project (staging for development). Ask Rami for the project id.
  variables:
    project:
      default: your-project-id
tags:
- name: Auth
- name: Account
- name: Legal
- name: Places
- name: Ratings
- name: Events
- name: Owners
- name: Payments
- name: Notifications
- name: Bookings
- name: Storage
- name: Site
- name: Staff
- name: Website functions
- name: Website pages
  description: Public HTML on Netlify. Kept from the 16 Oct reconstruction; not generated from database migrations.
- name: Edge Functions
  description: Account deletion. Kept from the 16 Oct reconstruction; not in the 21 Oct generated file.
security:
- apikey: []
  bearer: []
- apikey: []
paths:
  /auth/v1/signup:
    post:
      tags:
      - Auth
      summary: Sign up with email and password
      x-dalil-availability: Production and staging.
      responses:
        '200':
          description: 'OK (Supabase Auth response: session or user)'
        4XX:
          description: Auth error
      description: 'Sends a 6-digit email code. Strong password required. Then complete the profile. Supabase Auth reference: https://supabase.com/docs/reference/api
        (Auth). Google sign-in is turned on in the dashboard by Rami; Sign in with Apple is not used in v1.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
      security:
      - apikey: []
  /auth/v1/verify:
    post:
      tags:
      - Auth
      summary: Confirm the 6-digit email code
      x-dalil-availability: Production and staging.
      responses:
        '200':
          description: 'OK (Supabase Auth response: session or user)'
        4XX:
          description: Auth error
      description: 'type: signup (new account), email (code sign-in) or recovery.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                  - signup
                  - email
                  - recovery
                email:
                  type: string
                token:
                  type: string
      security:
      - apikey: []
  /auth/v1/otp:
    post:
      tags:
      - Auth
      summary: Send a 6-digit email code (passwordless or resend)
      x-dalil-availability: Production and staging.
      responses:
        '200':
          description: 'OK (Supabase Auth response: session or user)'
        4XX:
          description: Auth error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                create_user:
                  type: boolean
      security:
      - apikey: []
  /auth/v1/recover:
    post:
      tags:
      - Auth
      summary: Send a password-reset code
      x-dalil-availability: Production and staging.
      responses:
        '200':
          description: 'OK (Supabase Auth response: session or user)'
        4XX:
          description: Auth error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      security:
      - apikey: []
  /auth/v1/user:
    get:
      tags:
      - Auth
      summary: Current user
      x-dalil-availability: Production and staging.
      responses:
        '200':
          description: 'OK (Supabase Auth response: session or user)'
        4XX:
          description: Auth error
      security:
      - apikey: []
        bearer: []
    put:
      tags:
      - Auth
      summary: Change password or email
      x-dalil-availability: Production and staging.
      responses:
        '200':
          description: 'OK (Supabase Auth response: session or user)'
        4XX:
          description: Auth error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                email:
                  type: string
      security:
      - apikey: []
        bearer: []
  /auth/v1/logout:
    post:
      tags:
      - Auth
      summary: Sign out
      x-dalil-availability: Production and staging.
      responses:
        '200':
          description: 'OK (Supabase Auth response: session or user)'
        4XX:
          description: Auth error
      security:
      - apikey: []
        bearer: []
  /auth/v1/token:
    post:
      tags:
      - Auth
      summary: Sign in, refresh, or Google sign-in
      description: 'grant_type=password: {email, password}. grant_type=refresh_token: {refresh_token}. grant_type=id_token: {provider: google,
        id_token, nonce} from native Google Sign-In; after the first Google sign-in the app opens the profile screen (complete_profile).'
      parameters:
      - name: grant_type
        in: query
        required: true
        schema:
          type: string
          enum:
          - password
          - refresh_token
          - id_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
                refresh_token:
                  type: string
                provider:
                  type: string
                  enum:
                  - google
                id_token:
                  type: string
                nonce:
                  type: string
      security:
      - apikey: []
      x-dalil-availability: Production and staging.
      responses:
        '200':
          description: Session (access_token, refresh_token, user)
        4XX:
          description: Auth error
  /rest/v1/places:
    get:
      tags:
      - Places
      summary: Read places
      description: 'Facilities (restaurants, cafés, hotels...). Visitors see active and temporarily closed places. Staff and premium owners may
        PATCH; a trigger refuses owner changes to name, category, location or status (message "Name, category, location..." = send a change request
        instead). osm_hours is being retired: use place_hours / place_open_now.'
      parameters:
      - $ref: '#/components/parameters/select'
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/order'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      - $ref: '#/components/parameters/prefer'
      responses:
        '200':
          description: Rows the caller may see
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/places'
        4XX:
          $ref: '#/components/responses/Error'
      x-dalil-availability: Production and staging.
      x-dalil-access: 'places: only admin deletes (DELETE); places: editors add (INSERT); places: public read (SELECT); places: editors and premium
        owners update (UPDATE)'
    post:
      tags:
      - Places
      summary: Insert into places
      description: 'Writable columns: address, alt_name, area_id, created_at, cuisines, description_ar, description_en, email, facebook, fax,
        id, instagram, lat, lon, name_ar, name_en, osm_hours, phones, stars, status, tourism_class, tourism_class_by, tourism_class_verified,
        type, updated_at, verified_at, website.'
      parameters:
      - $ref: '#/components/parameters/prefer'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/places'
      responses:
        '201':
          description: Created
        4XX:
          $ref: '#/components/responses/Error'
      x-dalil-availability: Production and staging.
      x-dalil-access: 'places: only admin deletes (DELETE); places: editors add (INSERT); places: public read (SELECT); places: editors and premium
        owners update (UPDATE)'
    patch:
      tags:
      - Places
      summary: Update places
      description: 'Writable columns: address, alt_name, area_id, created_at, cuisines, description_ar, description_en, email, facebook, fax,
        id, instagram, lat, lon, name_ar, name_en, osm_hours, phones, stars, status, tourism_class, tourism_class_by, tourism_class_verified,
        type, updated_at, verified_at, website. Filter the rows with query filters.'
      parameters:
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/prefer'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '204':
          description: Updated (0 rows when not allowed)
        4XX:
          $ref: '#/components/responses/Error'
      x-dalil-availability: Production and staging.
      x-dalil-access: 'places: only admin deletes (DELETE); places: editors add (INSERT); places: public read (SELECT); places: editors and premium
        owners update (UPDATE)'
    delete:
      tags:
      - Places
      summary: Delete from places
      parameters:
      - $ref: '#/components/parameters/filter'
      - $ref: '#/components/parameters/prefer'
      responses:
        '204':
          description: Deleted (0 rows when not allowed)
        4XX:
          $ref: '#/components/responses/Error'
      x-dalil-availability: Production and staging.
      x-dalil-access: 'places: only admin deletes (DELETE); places: editors add (INSERT); places: public read (SELECT); places: editors and premium
