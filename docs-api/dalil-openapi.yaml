openapi: 3.1.0
info:
  license:
    name: Proprietary. All rights reserved.
  title: Dalil Dimashq API (Supabase + Netlify)
  version: '2026-10-13'
  summary: Reconstructed from source code; CONFIDENTIAL, for authorised project handover only.
  description: 'CONFIDENTIAL. For authorised project handover only; share under a confidentiality agreement.


    This file was written by hand from the source code on main of both repositories (website f388f23, app 0ad2e6a,
    12 Oct 2026). It is not generated from a live project. The project has no custom API server: the REST and RPC
    interface is generated by Supabase (PostgREST) from the database, and access is enforced by grants, Row Level
    Security and SECURITY DEFINER functions, not by this document.


    Scope: every table, view and function that a current client calls, plus functions that exist for clients but
    are not called yet, the Edge Function, the Netlify Functions and public photo URLs. Booking paths exist on the
    staging project only. Web Auth and Storage upload conventions that the live site uses are described here
    (reconstructed 16 Oct 2026 from public/owner/index.html, public/admin/index.html, public/contact/ and
    /fallback.json). Paths marked x-reconstructed: live-js were not in the original handwritten spec.


    Errors: PostgREST returns {code, message, details, hint}. Clients must branch on code (SQLSTATE) and, where
    stated, message, not on HTTP status, because PostgREST''s SQLSTATE-to-HTTP mapping differs by code and version.
    HTTP statuses shown for RPC errors are indicative.


    Extensions: x-callers lists the clients that call an operation (admin/owner = public/admin|owner/index.html
    line, app = dalil-app file and line); x-source gives the defining file and line. No secret, project reference
    or real URL of the database is included; replace {project_ref} with the project you are authorised to use.'
servers:
- url: https://{project_ref}.supabase.co
  description: Supabase project (production or staging). Not included here; ask the project owner.
  variables:
    project_ref:
      default: YOUR-PROJECT-REF
security:
- apikey: []
tags:
- name: Directory (tables)
  description: Public directory data. Readable with the publishable key alone.
- name: Owner and staff (tables)
  description: Owner and staff data; needs a signed-in user. RLS limits rows by role.
- name: Bookings (tables, staging only)
  description: Booking data (staging project only). Rows are written only by booking functions.
- name: 'RPC: owners and staff'
  description: Database functions called as POST /rest/v1/rpc/<name>. Each checks the caller itself.
- name: 'RPC: bookings (staging only)'
  description: Booking functions (staging project only). See supabase/bookings.md for rules and error codes.
- name: Edge Functions
  description: Supabase Edge Functions (Deno). Only delete-account exists.
- name: Storage
  description: Supabase Storage. Uploads and removals go through the SDK under bucket policies. Path conventions
    below are those the live owner and admin pages use.
- name: Auth (observed on the website)
  description: Supabase Auth through the official SDK. The owner and admin pages use email plus password. Observed
    rules are listed on /auth/v1/signup.
- name: Website (Netlify Functions)
  description: Public HTTP endpoints served by Netlify on the website domain.
