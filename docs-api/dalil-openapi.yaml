components:
  securitySchemes:
    apikey:
      type: apiKey
      in: header
      name: apikey
      description: Supabase publishable key. Public client configuration; safe in apps and browsers. Never use the
        service-role (secret) key in a client.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The signed-in user's Supabase access token. RLS and functions identify the caller with auth.uid().
    legacyAdminPassword:
      type: http
      scheme: bearer
      description: 'Legacy: the ADMIN_PASSWORD Netlify environment variable. Deprecated with /api/edits.'
  schemas:
    PostgrestError:
      type: object
      properties:
        code:
          type: string
          description: SQLSTATE (e.g. 42501, 22023, 55000, 54000, 23505, P0002) or PostgREST code (PGRSTxxx)
        message:
          type: string
          description: Plain English message raised by the database function
        details:
          type:
          - string
          - 'null'
        hint:
          type:
          - string
          - 'null'
      description: Error body returned by PostgREST for table and RPC calls.
    PlaceType:
      type: string
      enum:
      - restaurant
      - fast_food
      - cafe
      - hotel
      - guest_house
      - hostel
      - motel
    PlaceStatus:
      type: string
      enum:
      - active
      - temporarily_closed
      - permanently_closed
      - hidden
    BookingStatus:
      type: string
      enum:
      - waiting
      - pending
      - confirmed
      - rejected
      - expired
      - cancelled_by_customer
      - cancelled_by_owner
      - attended
      - no_show
    Place:
      type: object
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9]{1,24}$
        type:
          $ref: '#/components/schemas/PlaceType'
        status:
          $ref: '#/components/schemas/PlaceStatus'
        name_ar: *id021
        name_en:
          type:
          - string
          - 'null'
        alt_name:
          type:
          - string
          - 'null'
        area_id:
          type:
          - integer
          - 'null'
        address:
          type:
          - string
          - 'null'
        lat: &id028
          type: number
        lon: *id028
        phones:
          type: array
          items: *id021
        fax:
          type:
          - string
          - 'null'
        website:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
        facebook:
          type:
          - string
          - 'null'
        instagram:
          type:
          - string
          - 'null'
        description_ar:
          type:
          - string
          - 'null'
        description_en:
          type:
          - string
          - 'null'
        cuisines:
          type: array
          items: *id021
        osm_hours:
          type:
          - string
          - 'null'
        stars:
          type:
          - integer
          - 'null'
        tourism_class:
          type:
          - integer
          - 'null'
        tourism_class_by:
          type:
          - string
          - 'null'
        tourism_class_verified: *id022
        verified_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at: *id024
        updated_at: *id024
      description: 'Table public.places (supabase/migrations/20260926090000_core_schema.sql l.42; later columns:
        place-code migration l.92-94, verified-badge migration l.8).'
    Area:
      type: object
      properties:
        id: *id025
        name_en: *id021
        name_ar: *id021
        lat: *id028
        lon: *id028
      description: supabase/migrations/20260926090000_core_schema.sql l.34
    PlaceHours:
      type: object
      properties:
        id: *id025
        place_id: *id021
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: 0 = Sunday
        opens: &id029
          type: string
          description: HH:MM:SS
        closes: *id029
        season:
          type: string
          enum:
          - regular
