        '401':
          $ref: '#/components/responses/401'
      x-callers:
      - admin
      x-reconstructed: live-js
      x-source: public/admin/index.html loadFeatured
    post:
      tags:
      - Owner and staff (tables)
      operationId: post_featured
      summary: Create a featured slot
      description: 'Sales/admin. Body used by the admin form: place_id, starts_at (day start +03:00), ends_at (day
        end 23:59:59 +03:00). Optionally followed by a payments insert with item=featured.'
      security: *id003
